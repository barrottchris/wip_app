<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WIP Terminal</title>
  <style>
    html, body { height: 100%; margin: 0; background: #101417; color: #d7e0dc; font: 14px Consolas, monospace; }
    body { display: flex; flex-direction: column; }
    #output { flex: 1; overflow: auto; padding: 16px; white-space: pre-wrap; }
    #input { box-sizing: border-box; width: 100%; border: 0; border-top: 1px solid #34403d; padding: 12px 16px; background: #18201f; color: inherit; font: inherit; outline: 0; }
  </style>
</head>
<body>
  <pre id="output">Connecting...</pre>
  <input id="input" autofocus placeholder="Type a command and press Enter">
  <script>
    const params = new URLSearchParams(location.search);
    const app = params.get("app");
    const component = params.get("component");
    document.title = `${component || "Component"} - WIP Terminal`;
    const output = document.querySelector("#output");
    const input = document.querySelector("#input");
    let last = "";
    async function refresh() {
      try {
        const res = await fetch(`/api/apps/${encodeURIComponent(app)}`);
        const data = await res.json();
        const item = (data.components || []).find((entry) => entry.name === component);
        const text = (item && item.logs || []).join("\n");
        if (text !== last) { output.textContent = text; output.scrollTop = output.scrollHeight; last = text; }
      } catch (error) { output.textContent = `Connection lost: ${error}`; }
    }
    input.addEventListener("keydown", async (event) => {
      if (event.key !== "Enter") return;
      const value = input.value + "\r\n";
      input.value = "";
      await fetch(`/api/apps/${encodeURIComponent(app)}/terminal`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ component, input: value }) });
      refresh();
    });
    refresh();
    setInterval(refresh, 500);
  </script>
</body>
</html>
