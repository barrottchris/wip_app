<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WIP</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="shell">
    <header id="top-banner">
      <button class="brand" id="brand-home" type="button" aria-label="Go to WIP home">WIP</button>
      <div class="banner-actions">
        <span id="running-count" class="running-count"></span>
        <button id="add-app-btn">+ Add app</button>
      </div>
    </header>

    <div id="body">
      <nav id="side-nav">
        <div class="nav-item active" data-page="home">Home</div>
        <div class="nav-item" data-page="registry">Registry</div>
        <div class="nav-item" data-page="archived">Archived</div>
        <div class="nav-item" data-page="brainstorm">Brainstorm</div>
        <div class="nav-item" data-page="activity">Activity</div>
        <div class="nav-divider"></div>
        <div class="nav-item" data-page="settings">Settings</div>
      </nav>

      <main id="page-content">
        <!-- Rendered by main.js depending on selected nav item -->
      </main>
    </div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
